config_cls: MingTTSPipelineConfig
model_path: inclusionAI/Ming-omni-tts-16.8B-A3B
name: ming-omni-tts-apple-mps
# Requires SGLANG_USE_MLX=0. Non-streaming, unquantized Torch/MPS compatibility.
# Provisional budgets, not measured peaks or a guarantee of fitting in 48 GiB.
stages:
  preprocessing:
    process: preprocessing
    factory:
      context_length: 2048
      max_decode_steps_cap: 256
      max_concurrency: 1
  reference_encode:
    process: ming_tts_aux
    gpu: 0
    gpu_memory_fraction: 0.05
    factory:
      context_length: 2048
      max_concurrency: 1
      dtype: bfloat16
  tts_engine:
    process: tts_engine
    gpu: 0
    tp_size: 1
    gpu_memory_fraction: 0.80
    factory:
      context_length: 2048
      dtype: bfloat16
    engine:
      disable_cuda_graph: true
      disable_overlap_schedule: true
      disable_radix_cache: true
      enable_torch_compile: false
      max_running_requests: 1
      max_total_tokens: 2048
      max_prefill_tokens: 2048
      chunked_prefill_size: 0
      attention_backend: torch_native
      sampling_backend: pytorch
      trust_remote_code: false
  audio_decode:
    process: ming_tts_aux
    gpu: 0
    gpu_memory_fraction: 0.10
    factory:
      dtype: bfloat16
      streaming_cuda_graph: false
      stream_slots: 1
      max_batch_size: 1
      max_batch_wait_ms: 0
